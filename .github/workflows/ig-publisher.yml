# This is a basic workflow to help you get started with Actions

name: Build and Publish IG

# Controls when the action will run.
on:
  push:
    branches:
      - '**'
      - '!gh-pages'
  pull_request:
  # Publishing a GitHub release builds that tag and promotes it to the site
  # root. The tag must match the version in sushi-config.yaml.
  release:
    types: [published]

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:

  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/gefyra/ig-publisher:latest
    env:
      INPUT_DIR: .

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Guards against publishing a build under a version it does not carry.
      - name: Resolve release version
        id: release
        if: github.event_name == 'release'
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          configured="$(awk '/^version:/ {print $2; exit}' sushi-config.yaml)"
          if [ "${version}" != "${configured}" ]; then
            echo "Release tag '${TAG}' resolves to version ${version}," >&2
            echo "but sushi-config.yaml declares ${configured}." >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      # Run SUSHI (FSH -> FHIR conversion) on Resources directory
      - name: Run SUSHI
        run: |
          sushi ${{ env.INPUT_DIR }}


      # Run the HL7 FHIR IG Publisher
      - name: Build IG
        run: |
          igpublisher -ig ${{ env.INPUT_DIR }}

      # Upload the IG build output as an artifact
      - name: Upload Build Results
        uses: actions/upload-artifact@v6
        with:
          name: fhir-ig
          path: |
            ${{ env.INPUT_DIR }}/output

      # Configure Git identity
      - name: Set git user
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      # Mark repository as safe to avoid dubious ownership warnings
      - name: Mark repository as safe
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        run: git config --global --add safe.directory ${{ github.workspace }}

      # Publish the IG output to a branch-specific preview directory
      - name: Publish branch preview to GitHub Pages
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        shell: bash
        env:
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_DIR: ${{ env.INPUT_DIR }}/output
        run: scripts/gh-pages.sh publish-preview "${GITHUB_REF_NAME}"

      # Promote a published release to the site root and archive it by version
      - name: Publish release to GitHub Pages
        if: github.event_name == 'release'
        shell: bash
        env:
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_DIR: ${{ env.INPUT_DIR }}/output
        run: scripts/gh-pages.sh publish-release "${{ steps.release.outputs.version }}"

      - name: Announce published URL
        id: announce_url
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')) ||
          github.event_name == 'release'
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -eu
          site="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          if [ "${GITHUB_EVENT_NAME}" = release ]; then
            url="${site}/"
            what="release ${RELEASE_VERSION}"
          else
            url="${site}/branches/${GITHUB_REF_NAME}/"
            what="branch \`${GITHUB_REF_NAME}\`"
          fi
          echo "Published to ${url}"
          printf '### Deployment\n[Open published IG for %s](%s)\n' "${what}" "${url}" >> "${GITHUB_STEP_SUMMARY}"
          echo "published_url=${url}" >> "${GITHUB_OUTPUT}"

      - name: Upsert PR comment with published URL
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        uses: actions/github-script@v8
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          PUBLISHED_URL: ${{ steps.announce_url.outputs.published_url }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = process.env.BRANCH_NAME;
            const marker = '<!-- ig-publish-url -->';
            const url = process.env.PUBLISHED_URL;
            const body = `${marker}
            ### Deployment
            [Open published IG for branch \`${branch}\`](${url})`;

            // Try to find an open PR for this branch
            const { data: prs } = await github.rest.pulls.list({
              owner, repo, state: 'open', per_page: 100
            });
            const pr = prs.find(p => p.head && p.head.ref === branch);
            if (!pr) {
              core.info(`No open PR found for branch ${branch}; skipping PR comment.`);
              return;
            }

            // List existing comments on that PR
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: pr.number, per_page: 100
            });

            // Find existing marker comment (any author)
            const existing = comments.find(c => typeof c.body === 'string' && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body
              });
              core.info(`Updated IG publish URL comment on PR #${pr.number}`);
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: pr.number, body
              });
              core.info(`Created IG publish URL comment on PR #${pr.number}`);
            }
